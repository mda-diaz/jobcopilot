name: Daily Job Digest

on:
  schedule:
    # 09:00 UTC ≈ 10:00 Madrid (CET). During CEST (UTC+2) this runs ~11:00 local —
    # cron can't express the DST shift, so expect a ~1h drift for part of the year.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - run: pip install -r requirements.txt

      # data/seen_jobs.json is gitignored and this runner is thrown away
      # after every run, so "already seen" dedup wouldn't otherwise survive
      # between scheduled runs — every run would resend every still-live
      # listing as if new. Restore the most recent cache entry (fuzzy-matched
      # by the "seen-jobs-" prefix, since the exact key below is always a
      # fresh run id and will never hit on restore) to carry state forward.
      - name: Restore seen-jobs cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      # First run ever (no cache hit yet): main.py/fetch.py expect this file
      # to exist and don't handle a missing one.
      - name: Ensure seen-jobs file exists
        run: |
          mkdir -p data
          [ -f data/seen_jobs.json ] || echo "[]" > data/seen_jobs.json

      # config/profile.yaml and config/cv_template.md are gitignored, so they
      # don't exist on this runner. Restore them from base64 repo secrets —
      # nothing is committed, the decoded files only ever live in this
      # ephemeral job. Note: this carries the *extracted CV text*
      # (cv_template.md), not the original PDF — tailor.py checks for that
      # cache first and only falls back to cv.pdf if it's missing. The raw
      # PDF's base64 form is well over GitHub's per-secret size limit for a
      # typical multi-page CV; the extracted plain text is a few KB and fits.
      - name: Restore CV and profile from secrets
        run: |
          mkdir -p config
          echo "${{ secrets.PROFILE_YAML_B64 }}" | base64 --decode > config/profile.yaml
          echo "${{ secrets.CV_TEMPLATE_MD_B64 }}" | base64 --decode > config/cv_template.md

      # This repo is public, so job logs are public too. GitHub only masks
      # secrets.* values themselves, not the decoded file content — register
      # every substantive line as a masked value before the pipeline runs, so
      # any accidental print of your name, contact info, or work history
      # renders as *** in the log instead of leaking.
      - name: Mask personal data in logs
        run: python3 .github/scripts/mask_secrets.py

      - run: python3 main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Delivery is via Telegram (src/notify.py), not a repo commit:
      # data/digests/ is gitignored (CLAUDE.md: "Do not commit generated output"),
      # so results are not written back to the repository.

      # main.py updates data/seen_jobs.json in-place at the end of its own
      # run — save that updated state under a key unique to this run (never
      # collides, so this always succeeds) for the next run's restore step
      # to pick up via the "seen-jobs-" prefix match above.
      - name: Save seen-jobs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
